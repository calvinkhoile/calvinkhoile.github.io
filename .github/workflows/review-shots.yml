name: Review shots

# Temporary: phone captures for the review session, uploaded as a workflow artifact. Never deploys.
# Removed before the branch's PR opens.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.review.config.ts
        continue-on-error: true
      - name: Shrink the pictures
        run: |
          command -v mogrify || sudo apt-get install -y imagemagick
          find review-shots -name '*.png' -print0 | xargs -0 -r mogrify -resize 50% -quality 72 -format jpg
          find review-shots -name '*.png' -delete
      - name: Push the pictures to a hidden ref
        env:
          TOKEN: ${{ github.token }}
          REF: refs/review/${{ github.run_id }}-r3
        run: |
          cd review-shots
          git init -q . && git add -A
          git -c user.name=review-bot -c user.email=review-bot@users.noreply.github.com commit -qm "Review shots at ${{ github.sha }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:${REF}
