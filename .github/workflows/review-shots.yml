name: Review shots

# Temporary, for the polish pass: captures every screen and pop-up at five viewports and uploads the pictures.
# Never deploys. Removed before the polish branch merges.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [se, phone, land, tablet, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.review.config.ts --project=${{ matrix.project }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.project }}
          path: review-shots/
          retention-days: 3
