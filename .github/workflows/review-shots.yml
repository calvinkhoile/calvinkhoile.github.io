name: Review shots

# Temporary, for the polish pass: captures every screen and pop-up at five viewports.
# The pictures go to a hidden ref (refs/review/...), not a branch, so the review session can fetch them over git.
# Never deploys. Removed, with its refs, before the polish branch merges.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [se, phone, land, tablet, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.review.config.ts --project=${{ matrix.project }}
        continue-on-error: true
      - name: Shrink and push the pictures to a hidden ref
        env:
          TOKEN: ${{ github.token }}
          REF: refs/review/${{ github.run_id }}-${{ matrix.project }}
        run: |
          command -v mogrify || sudo apt-get install -y imagemagick
          mkdir -p /tmp/out && cp -r review-shots/. /tmp/out/
          cd /tmp/out
          find . -name '*.png' -print0 | xargs -0 -r mogrify -resize 50% -quality 72 -format jpg
          find . -name '*.png' -delete
          git init -q . && git add -A
          git -c user.name=review-bot -c user.email=review-bot@users.noreply.github.com commit -qm "Review shots ${{ matrix.project }} at ${{ github.sha }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:${REF}
