<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Calvin Le | MyPark</title>
  <meta name="description" content="Calvin Le, Senior Product Manager at BetMGM. Walk around MyPark, a small 3D world built from his career." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Points at the classic site until /resume ships in M7. -->
  <a class="skip-link" href="/classic/">Skip to the classic site</a>

  <canvas id="world" aria-label="MyPark, a 3D world you can walk around"></canvas>

  <div id="ui">
    <div id="hint" class="hint" role="note">
      <span class="hint-desktop">WASD or arrow keys to move · Shift to sprint · Click to walk there</span>
      <span class="hint-touch">Drag bottom-left to move · Tap to walk there</span>
    </div>
    <button id="a-button" class="a-button" type="button" aria-label="Interact">A</button>
  </div>

  <div id="fallback" class="fallback" hidden>
    <h1>Your device is sitting this one out.</h1>
    <p>Here's the fast version.</p>
    <a href="/classic/">Open the classic site</a>
  </div>

  <noscript>
    <div class="fallback">
      <h1>Calvin Le</h1>
      <p>Senior Product Manager at BetMGM. This page needs JavaScript.</p>
      <a href="/classic/">Open the classic site</a>
    </div>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
